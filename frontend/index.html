<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="public/proofhire-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <script>
    const themePreference = localStorage.getItem('proofhire-theme');
    document.documentElement.dataset.theme = themePreference ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F7FF">
  <meta name="description" content="ProofHire tests understanding with work-linked questions and verifiable evidence.">
  <title>ProofHire // Evidence-based hiring</title>
  <link rel="stylesheet" href="static.css">
  <link rel="stylesheet" href="readability.css">
  <script src="static.js" defer></script>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div id="app" aria-live="polite"></div>
</body>
</html>
