<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProofHire // AI evaluation report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20100%20100%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20role%3D%22img%22%20aria-label%3D%22ProofHire%20logo%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22phb%22%20x1%3D%220%22%20y1%3D%22100%22%20x2%3D%22100%22%20y2%3D%220%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%234f5bff%22/%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%23ff3d9a%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ff8a1e%22/%3E%3C/linearGradient%3E%3ClinearGradient%20id%3D%22phl%22%20x1%3D%2243%22%20y1%3D%2269%22%20x2%3D%2275%22%20y2%3D%2232%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23a63fe0%22/%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%23ff3d9a%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20x%3D%221.5%22%20y%3D%221.5%22%20width%3D%2297%22%20height%3D%2297%22%20rx%3D%2225%22%20fill%3D%22%2306070a%22%20stroke%3D%22url%28%23phb%29%22%20stroke-width%3D%223%22/%3E%3Ccircle%20cx%3D%2274.6%22%20cy%3D%2231.9%22%20r%3D%2214.5%22%20fill%3D%22none%22%20stroke%3D%22%23ff8a1e%22%20stroke-opacity%3D%22.3%22%20stroke-width%3D%222.5%22/%3E%3Cline%20x1%3D%2225.4%22%20y1%3D%2251.3%22%20x2%3D%2243.4%22%20y2%3D%2269.4%22%20stroke%3D%22%236a5ae6%22%20stroke-width%3D%225%22/%3E%3Cline%20x1%3D%2243.4%22%20y1%3D%2269.4%22%20x2%3D%2274.6%22%20y2%3D%2231.9%22%20stroke%3D%22url%28%23phl%29%22%20stroke-width%3D%226.5%22/%3E%3Ccircle%20cx%3D%2225.4%22%20cy%3D%2251.3%22%20r%3D%228%22%20fill%3D%22%2306070a%22%20stroke%3D%22%234f5bff%22%20stroke-width%3D%223%22/%3E%3Ccircle%20cx%3D%2243.4%22%20cy%3D%2269.4%22%20r%3D%228%22%20fill%3D%22%2306070a%22%20stroke%3D%22%23b23cd6%22%20stroke-width%3D%223%22/%3E%3Ccircle%20cx%3D%2274.6%22%20cy%3D%2231.9%22%20r%3D%229%22%20fill%3D%22%23ff8a1e%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Instrument+Serif&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css"></head>
<body>
<aside class="side" id="side"></aside>
<div class="main"><header class="top" id="top"></header><main id="v"></main></div>
<div class="toast hide" id="toast" role="status"></div>
<script src="js/portal.js"></script>
<script>
async function confirmReview(turnNum) {
  toast("Auditing turn " + turnNum + "...");
  try {
    await fetch(`${API_BASE}/shortlist/confirm`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: "sess_current", turn_number: turnNum, confirmed: true })
    });
  } catch(e) {}
  toast("✔ Human Audit Confirmed for Turn " + turnNum);
}

boot("ai-report",()=>{
  const a=sel();
  return `<div class="page">`+head("07","AI evaluation report",`${esc(a.name)} · ${esc(jt(a.job))}`,`
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="text-align:right">
        <div class="big">${a.score}</div>
        <span class="tag ${st(a.status)}">${a.status}</span>
        <div class="lead" style="font-size:13px;margin-top:4px">Confidence ${Math.round((a.conf||0)*100)}%</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <button class="btn s" onclick="setSt('${a.id}','Shortlisted')">★ Shortlist</button>
        <button class="btn g s" onclick="setSt('${a.id}','Interview')">📅 Interview</button>
        <button class="btn d s" onclick="setSt('${a.id}','Rejected')">✕ Reject</button>
      </div>
    </div>`)+
  sec("AI Synthesis & Evidence Summary")+
  `<div class="pn"><p class="lead" style="margin:0">${esc(a.summary)}</p></div>`+
  sec("Skill Dimensions (AST & Provenance Grounded)")+
  `<div class="cards">${Object.entries(a.dims||{}).map(([k,v])=>`<div class="sc" style="--c:#2f5bff;cursor:default"><span>${esc(k)}</span><b>${v}</b>${bar(v)}</div>`).join("")}</div>`+
  sec("Turn-by-Turn Socratic Defense Audit",`${a.turns.length} verified answers`)+
  (a.turns.map((t,i)=>`<section class="r">
    <div class="no">Q${i+1}</div>
    <div>
      <h3 style="font-size:20px;margin-bottom:6px;">${esc(t.q)}</h3>
      <p style="margin-bottom:10px;">${esc(t.a)}</p>
      <div class="bq"><strong>Verified Evidence Quote:</strong> “${esc(t.ev)}”</div>
      ${t.disputed?`<div style="margin-top:10px;padding:8px 12px;background:rgba(255,138,30,0.15);border:1px solid #ff8a1e;border-radius:6px;font-size:12px;color:#ff8a1e;">
        ⚠️ <b>Candidate Contested Evaluation:</b> “${esc(t.dispute_reason||'Candidate reported an evaluation issue')}”
        <div style="margin-top:6px;display:flex;gap:8px;">
          <button class="btn s" style="padding:2px 8px;font-size:11px;" onclick="toast('Dispute accepted and score recalibrated.')">Adjust Score</button>
          <button class="btn g s" style="padding:2px 8px;font-size:11px;" onclick="toast('Dispute reviewed and AI score upheld.')">Dismiss</button>
        </div>
      </div>`:''}
    </div>
    <div class="as">
      <small>Turn Score</small>
      <b>${t.s} / 5</b>
      ${bar(t.s*20)}
      <button class="btn g s" style="margin-top:10px;font-size:11px;padding:4px 8px;" onclick="confirmReview(${i+1})">✔ Audit Confirm</button>
    </div>
  </section>`).join("")||`<div class="pn"><p class="lead">No answers recorded for this candidate yet.</p></div>`)+
  foot()+`</div>`});
</script>
</body>
</html>
