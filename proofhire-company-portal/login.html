boot("login",()=>`<div class="auth"><div class="logo" style="width:64px;height:64px;margin-bottom:22px">${LOGO}</div><div class="eb">Field notes / 00 / Company sign in</div><h1>Welcome back<s>.</s></h1><p class="lead">Hire on proof of understanding, not résumés.</p>

<label for="a_e">Work email</label><input id="a_e" type="email" value="hiring@finleaf.com"><label for="a_p">Password</label><input id="a_p" type="password" value="password">
