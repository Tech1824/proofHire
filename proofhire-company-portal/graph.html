<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProofHire // Knowledge graph</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20100%20100%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20role%3D%22img%22%20aria-label%3D%22ProofHire%20logo%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22phb%22%20x1%3D%220%22%20y1%3D%22100%22%20x2%3D%22100%22%20y2%3D%220%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%234f5bff%22/%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%23ff3d9a%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ff8a1e%22/%3E%3C/linearGradient%3E%3ClinearGradient%20id%3D%22phl%22%20x1%3D%2243%22%20y1%3D%2269%22%20x2%3D%2275%22%20y2%3D%2232%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23a63fe0%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ff3d9a%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20x%3D%221.5%22%20y%3D%221.5%22%20width%3D%2297%22%20height%3D%2297%22%20rx%3D%2225%22%20fill%3D%22%2306070a%22%20stroke%3D%22url%28%23phb%29%22%20stroke-width%3D%223%22/%3E%3Ccircle%20cx%3D%2274.6%22%20cy%3D%2231.9%22%20r%3D%2214.5%22%20fill%3D%22none%22%20stroke%3D%22%23ff8a1e%22%20stroke-opacity%3D%22.3%22%20stroke-width%3D%222.5%22/%3E%3Cline%20x1%3D%2225.4%22%20y1%3D%2251.3%22%20x2%3D%2243.4%22%20y2%3D%2269.4%22%20stroke%3D%22%236a5ae6%22%20stroke-width%3D%225%22/%3E%3Cline%20x1%3D%2243.4%22%20y1%3D%2269.4%22%20x2%3D%2274.6%22%20y2%3D%2231.9%22%20stroke%3D%22url%28%23phl%29%22%20stroke-width%3D%226.5%22/%3E%3Ccircle%20cx%3D%2225.4%22%20cy%3D%2251.3%22%20r%3D%228%22%20fill%3D%22%2306070a%22%20stroke%3D%22%234f5bff%22%20stroke-width%3D%223%22/%3E%3Ccircle%20cx%3D%2243.4%22%20cy%3D%2269.4%22%20r%3D%228%22%20fill%3D%22%2306070a%22%20stroke%3D%22%23b23cd6%22%20stroke-width%3D%223%22/%3E%3Ccircle%20cx%3D%2274.6%22%20cy%3D%2231.9%22%20r%3D%229%22%20fill%3D%22%23ff8a1e%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Instrument+Serif&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css"></head>
<body>
<aside class="side" id="side"></aside>
<div class="main"><header class="top" id="top"></header><main id="v"></main></div>
<div class="toast hide" id="toast" role="status"></div>
<script src="js/portal.js"></script>
<script>
const GM=[["joblead","Job Leads","Openings in scope","search","#4f7cff"],["candidate","Candidate","Root profile","user","#9b6bd6"],["skill","Skills","Tools and capabilities","spark","#e0743a"],["experience","Experience","Roles and companies","brief","#4f9a6a"],["project","Projects","Proof of work","layers","#d1568f"]];
const IC={search:'<circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>',brief:'<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
function gsel(k){D.gk=k;save();render()}
function radar(c,k){const cx=200,cy=185,R=110,mx=Math.max(...GM.map(m=>c[m[0]]),1),pt=(i,r)=>{const a=(-90+72*i)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]},f=p=>p.map(n=>n.toFixed(1)).join(",");
 const vals=GM.map((m,i)=>pt(i,R*(.2+.8*Math.sqrt(c[m[0]]/mx))));
 return `<svg viewBox="0 0 400 370" width="100%" style="max-width:460px;display:block;margin:6px auto 0" role="img" aria-label="Topology of graph node types">`+
 [.25,.5,.75,1].map(q=>`<polygon points="${GM.map((_,i)=>f(pt(i,R*q))).join(" ")}" class="rg"/>`).join("")+
 GM.map((_,i)=>{const p=pt(i,R);return `<line class="ra" x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}"/>`}).join("")+
 `<polygon points="${vals.map(f).join(" ")}" class="rd"/>`+
 GM.map((m,i)=>{const v=vals[i],l=pt(i,R+36);return `<g class="vx" tabindex="0" onclick="gsel('${m[0]}')" style="cursor:pointer"><title>${m[1]}: ${c[m[0]]}</title><circle cx="${v[0]}" cy="${v[1]}" r="${k===m[0]?10:7}" fill="${m[4]}" stroke="var(--panel)" stroke-width="2.5"/><text x="${l[0]}" y="${l[1]-2}" text-anchor="middle" class="svl">${m[0].toUpperCase()}</text><text x="${l[0]}" y="${l[1]+18}" text-anchor="middle" class="svn">${c[m[0]]}</text></g>`}).join("")+`</svg>`}
function detail(g,k){const m=GM.find(x=>x[0]===k),ch=(t,fn)=>`<button class="chip cl" onclick="${fn}">${esc(t)}</button>`;let b="";
 if(k==="joblead")b=g.open.map(j=>ch(j.title+" · "+j.co,`nav('role:${j.id}')`)).join("");
 if(k==="candidate")b=D.apps.map(a=>ch(a.name+(a.score?" · "+a.score:""),`openC(${a.id})`)).join("");
 if(k==="skill")b=Object.entries(g.sk).sort((x,y)=>y[1]-x[1]).map(([s,n])=>`<span class="chip">${esc(s)} · ${n?n+" candidate"+(n>1?"s":""):"role only"}</span>`).join("");
 if(k==="experience")b=g.exp.map(e=>ch(`${e.a.name} · ${e.a.exp} yr · ${e.n} role${e.n>1?"s":""}`,`openC(${e.a.id})`)).join("");
 if(k==="project")b=g.proj.map(p=>ch(`${p.t} · ${p.a.name}`,`openR(${p.a.id})`)).join("");
 return `<div class="gcard" style="margin-top:20px"><span class="mono">Selected</span><h3 class="serif" style="font-size:30px;margin:8px 0 16px">${m[1]} · ${g.c[k]} node${g.c[k]===1?"":"s"}</h3>${b||'<span class="lead" style="font-size:15px">Nothing here yet.</span>'}</div>`}
boot("graph",()=>{const g=gdata(),c=g.c,k=D.gk||"skill",mx=Math.max(...GM.map(m=>c[m[0]]),1),ev=c.total-c.candidate-c.joblead;
return `<div class="page"><div class="gt serif">Knowledge Graph <span class="gtag">GRAPH</span></div>
<div class="gcard ghead"><div><span class="mono">Local graph</span><h2>Knowledge Map</h2><p class="lead" style="font-size:15px">Candidate evidence, job leads, and project proof in one graph.</p></div>
<div class="gnums"><div class="gtot"><span class="mono">Total nodes</span><div class="big serif">${c.total}</div></div><div class="gmini"><div><b>${ev}</b><br><span>Evidence nodes</span></div><div><b>${c.joblead}</b><br><span>Job leads</span></div></div></div></div>
<div class="gmain"><div class="gcard"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">Topology</b><span class="tag">live</span></div><span class="mono">5-vertex schema</span>${radar(c,k)}</div>
<div class="gstack">${GM.map(m=>`<button class="gi ${k===m[0]?"on":""}" style="--c:${m[4]}" onclick="gsel('${m[0]}')"><span class="gic">${ic(m[3])}</span><span class="gtx"><b>${m[1]}</b><small>${m[2]}</small></span><span class="gn serif">${c[m[0]]}</span><span class="gbar"><i style="width:${c[m[0]]?Math.max(c[m[0]]/mx*100,2):0}%"></i></span></button>`).join("")}</div></div>`+detail(g,k)+`</div>`});
</script>
</body>
</html>
