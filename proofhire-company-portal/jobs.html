<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css"></head>
<body>
<aside class="side" id="side"></aside>
<div class="main"><header class="top" id="top"></header><main id="v"></main></div>
<div class="toast hide" id="toast" role="status"></div>
<script src="js/portal.js"></script>
<script>
function addJob(){const t=$("#j_t").value.trim();if(!t){toast("Enter a job title");return}D.jobs.push({id:Date.now(),title:t,co:D.company.name,track:$("#j_c").value,desc:$("#j_d").value,skills:$("#j_s").value||"—",status:"Open",task:"Not set",min:45});save();toast("Job published");render()}
function delJob(id){if(confirm("Delete this job?")){D.jobs=D.jobs.filter(j=>j.id!=id);if(D.jobId==id)D.jobId=D.jobs[0]?.id;save();render()}}
function flip(i){D.jobs[i].status=D.jobs[i].status==="Open"?"Closed":"Open";save();render()}
function openRole(id){D.jobId=id;save();go("applicants")}
boot("jobs",()=>`<div class="page">`+head("03","Open roles","Choose a role to review its practical assessment and evidence-backed shortlist.",`<button class="btn" onclick="$('#jf').classList.toggle('hide')">+ Create job</button>`)+
`<div class="pn hide" id="jf"><div class="f2"><div><label for="j_t">Title</label><input id="j_t"></div><div><label for="j_c">Track</label><input id="j_c" value="Junior"></div></div><label for="j_d">Description</label><input id="j_d"><label for="j_s">Skills (comma separated)</label><input id="j_s"><p style="margin-top:18px"><button class="btn" onclick="addJob()">Publish job</button></p></div>`+
sec("Active requisitions",`${pad(D.jobs.filter(j=>j.status==="Open").length)} open ●`)+
D.jobs.map((j,i)=>`<section class="r click" data-open="role:${j.id}" tabindex="0"><div class="no">${pad(i+1)}</div><div><div class="mt">${esc(j.co)} / ${esc(j.track)} track · <span style="color:${j.status==="Open"?"var(--ok)":"var(--warn)"}">${j.status}</span></div><h3>${esc(j.title)}</h3><p>${esc(j.desc)}</p>${chips(j.skills)}</div>
<div class="as"><small>Assessment</small><b>${esc(j.task)}</b><div class="m">${j.min} min · Code + Depth</div><button class="btn g" onclick="openRole(${j.id})">Open role ↗</button><button class="btn g s" onclick="flip(${i})">${j.status==="Open"?"Close":"Reopen"}</button><button class="btn d s" onclick="delJob(${j.id})">Delete</button></div></section>`).join("")+foot()+`</div>`);
</script>
</body>
</html>
