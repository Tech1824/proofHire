<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css"></head>
<body>
<aside class="side" id="side"></aside>
<div class="main"><header class="top" id="top"></header><main id="v"></main></div>
<div class="toast hide" id="toast" role="status"></div>
<script src="js/portal.js"></script>
<script>
boot("dashboard",()=>{const a=D.apps,done=a.filter(x=>x.score),avg=done.length?Math.round(done.reduce((s,x)=>s+x.score,0)/done.length):0;
return `<div class="page">`+head("01","Dashboard","Hiring activity across your open roles.",`<a class="btn" href="jobs.html">+ Create job</a>`)+sec("Overview",`${D.jobs.filter(j=>j.status==="Open").length} open ●`)+
`<div class="cards">`+[
["jobs.html",D.jobs.length,"Jobs","Manage open roles","#2f5bff"],
["applicants.html",a.length,"Applicants","Review and move candidates","#8b5cf6"],
["ai-report.html",done.length,"Assessed","Open AI reports","#19c37d"],
["compare.html",avg,"Average score","Compare candidates","#ff9a3d"],
["shortlist.html",a.filter(x=>x.status==="Shortlisted").length,"Shortlisted","See the ranked shortlist","#ff3d9a"]
].map(c=>`<a class="sc" href="${c[0]}" style="--c:${c[4]}"><i>↗</i><span>${c[2]}</span><b>${c[1]}</b><small>${c[3]}</small></a>`).join("")+`</div>`+
sec("Latest applicants")+a.slice(-3).reverse().map((x,i)=>`<section class="r click" data-open="c:${x.id}" tabindex="0"><div class="no">${pad(i+1)}</div><div><div class="mt">${esc(jt(x.job))} / ${x.status}</div><h3>${esc(x.name)}</h3><p>${esc(x.summary)}</p>${chips(x.skills)}</div><div class="as"><small>Score</small><b>${x.score||"—"}</b><button class="btn g" onclick="openC(${x.id})">Open profile ↗</button></div></section>`).join("")+foot()+`</div>`});
</script>
</body>
</html>
