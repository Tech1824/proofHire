<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css"></head>
<body>
<aside class="side" id="side"></aside>
<div class="main"><header class="top" id="top"></header><main id="v"></main></div>
<div class="toast hide" id="toast" role="status"></div>
<script src="js/portal.js"></script>
<script>
function flt(s){D.stf=D.stf===s?"":s;save();render()}
boot("applicants",()=>{const all=D.apps.filter(a=>a.job==D.jobId),f=D.stf||"",l=all.filter(a=>!f||a.status===f);
const S=[["New","#ff9a3d"],["Reviewed","#f5c542"],["Interview","#2f5bff"],["Shortlisted","#19c37d"],["Rejected","#ff5c7a"]];
return `<div class="page">`+head("04","Applicants","Review everyone who applied to "+esc(jt(D.jobId))+". Click a status to filter the list.")+sec("Pipeline",f?`Filter: ${f}`:`${pad(all.length)} total ●`)+
`<div class="cards">${S.map(([s,c])=>`<button class="sc ${f===s?"on":""}" style="--c:${c}" onclick="flt('${s}')"><i>↗</i><span>${s}</span><b>${all.filter(a=>a.status===s).length}</b><small>${f===s?"Click to clear":"Click to filter"}</small></button>`).join("")}</div>`+
(l.map((a,i)=>`<section class="r click" data-open="c:${a.id}" tabindex="0"><div class="no">${pad(i+1)}</div><div><div class="mt">${esc(jt(a.job))} / ${a.exp} yr experience</div><h3>${esc(a.name)}</h3><p>${esc(a.email)} · github.com/${esc(a.github)}</p>${chips(a.skills)}</div>
<div class="as"><small>Status</small><select style="margin-bottom:14px" onchange="setSt(${a.id},this.value)" aria-label="Status">${["New","Reviewed","Interview","Shortlisted","Rejected"].map(s=>`<option ${s===a.status?"selected":""}>${s}</option>`).join("")}</select><button class="btn g s" onclick="openC(${a.id})">Profile</button><button class="btn g s" onclick="openR(${a.id})">Report</button></div></section>`).join("")||`<div class="pn"><p class="lead">No applicants match.</p></div>`)+foot()+`</div>`});
</script>
</body>
</html>
