<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Instrument+Serif&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css"></head>
<body>
<aside class="side" id="side"></aside>
<div class="main"><header class="top" id="top"></header><main id="v"></main></div>
<div class="toast hide" id="toast" role="status"></div>
<script src="js/portal.js"></script>
<script>
function exportSl(){const t=D.apps.filter(a=>a.status==="Shortlisted").map(a=>`${a.name} (${a.score}) – ${jt(a.job)}`).join("\n")||"No one shortlisted yet";(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Shortlist copied"),()=>toast(t))}
boot("shortlist",()=>{const l=D.apps.filter(a=>a.score&&a.job==D.jobId).sort((a,b)=>b.score-a.score);return `<div class="page">`+head("09","Shortlist","Ranked by verified understanding. Pick who moves forward.",`<button class="btn g" onclick="exportSl()">Copy shortlist</button>`)+sec("Ranked candidates",`${pad(l.length)} assessed ●`)+
(l.map((a,i)=>`<section class="r click" data-open="r:${a.id}" tabindex="0"><div class="no">${pad(i+1)}</div><div><div class="mt">${a.rec} / <span class="tag ${st(a.status)}">${a.status}</span></div><h3>${esc(a.name)}</h3><p>${esc(a.summary)}</p><div class="bq">“${esc(a.turns[0]?.ev||"")}”</div></div>
<div class="as"><small>Score · ${Math.round(a.conf*100)}% confidence</small><div class="big" style="margin-bottom:16px">${a.score}</div><button class="btn s" onclick="setSt(${a.id},'Shortlisted')">Shortlist</button><button class="btn d s" onclick="setSt(${a.id},'Rejected')">Reject</button><button class="btn g s" onclick="openR(${a.id})">Report</button></div></section>`).join("")||`<p class="lead" style="padding:30px 12px">No assessed candidates for this role yet.</p>`)+foot()+`</div>`});
</script>
</body>
</html>
