<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css"></head>
<body>
<aside class="side" id="side"></aside>
<div class="main"><header class="top" id="top"></header><main id="v"></main></div>
<div class="toast hide" id="toast" role="status"></div>
<script src="js/portal.js"></script>
<script>
function addAs(){const t=$("#s_t").value.trim();if(!t){toast("Enter a task title");return}D.assess.push({id:Date.now(),title:t,job:+$("#s_j").value,min:+$("#s_m").value,type:"Code + Depth",brief:$("#s_b").value});save();toast("Assessment created");render()}
function delAs(id){D.assess=D.assess.filter(x=>x.id!=id);save();render()}
boot("assessments",()=>`<div class="page">`+head("06","Assessments","Each role has one practical task followed by a depth check on the candidate's own answer.",`<button class="btn" onclick="$('#af').classList.toggle('hide')">+ New assessment</button>`)+
`<div class="pn hide" id="af"><div class="f2"><div><label for="s_t">Task title</label><input id="s_t"></div><div><label for="s_j">Role</label><select id="s_j">${D.jobs.map(j=>`<option value="${j.id}">${esc(j.title)}</option>`).join("")}</select></div><div><label for="s_m">Minutes</label><input id="s_m" type="number" value="45"></div><div><label for="s_b">Brief</label><input id="s_b"></div></div><p style="margin-top:18px"><button class="btn" onclick="addAs()">Create assessment</button></p></div>`+sec("Assessments",`${pad(D.assess.length)} total ●`)+
D.assess.map((s,i)=>`<section class="r click" data-open="role:${s.job}" tabindex="0"><div class="no">${pad(i+1)}</div><div><div class="mt">${esc(jt(s.job))}</div><h3>${esc(s.title)}</h3><p>${esc(s.brief)}</p></div><div class="as"><small>Format</small><b>${s.min} min</b><div class="m">${s.type} · ${D.apps.filter(a=>a.job==s.job&&a.score).length}/${D.apps.filter(a=>a.job==s.job).length} completed</div><button class="btn d s" onclick="delAs(${s.id})">Delete</button></div></section>`).join("")+foot()+`</div>`);
</script>
</body>
</html>
