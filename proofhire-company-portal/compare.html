<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css"></head>
<body>
<aside class="side" id="side"></aside>
<div class="main"><header class="top" id="top"></header><main id="v"></main></div>
<div class="toast hide" id="toast" role="status"></div>
<script src="js/portal.js"></script>
<script>
function pick(i,v){D.cmp[i]=+v;save();render()}
boot("compare",()=>{const o=D.apps.filter(a=>a.score),c=D.cmp.map(i=>D.apps.find(a=>a.id==i)||o[0]),ds=Object.keys(o[0].dims),pk=i=>`<select onchange="pick(${i},this.value)" aria-label="Candidate ${i+1}">${o.map(x=>`<option value="${x.id}" ${c[i].id==x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`;
return `<div class="page">`+head("08","Candidate comparison","Compare assessed candidates side by side. Click a card to open the profile.")+sec("Choose candidates")+
`<div class="cg">${c.map((x,i)=>`<div class="pn click" data-open="c:${x.id}" tabindex="0"><span class="k">Candidate ${i+1}</span>${pk(i)}<div class="big" style="margin-top:18px">${x.score}</div><div class="mt" style="margin-top:8px">${x.rec}</div></div>`).join("")}</div>`+
`<div class="pn tw"><table><thead><tr><th></th>${c.map(x=>`<th>${esc(x.name)}</th>`).join("")}</tr></thead><tbody>
<tr><td>Confidence</td>${c.map(x=>`<td>${Math.round(x.conf*100)}%</td>`).join("")}</tr><tr><td>Experience</td>${c.map(x=>`<td>${x.exp} yr</td>`).join("")}</tr>
${ds.map(d=>`<tr><td>${d}</td>${c.map(x=>`<td style="min-width:180px">${x.dims[d]}${bar(x.dims[d])}</td>`).join("")}</tr>`).join("")}<tr><td>Skills</td>${c.map(x=>`<td>${chips(x.skills)}</td>`).join("")}</tr></tbody></table></div>`+foot()+`</div>`});
</script>
</body>
</html>
